name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Validate agent skills specification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gh skill requires GitHub CLI v2.90.0+; upgrade to ensure it is available.
      - name: Upgrade GitHub CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gh

      - name: Validate skills with gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skill publish --dry-run
